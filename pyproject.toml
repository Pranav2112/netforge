[project]
name = "netforge"
version = "0.1.0"
description = "Network automation and resilience lab: FRRouting/BGP topologies, failure injection, and convergence measurement."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pranav2112", email = "pranavauti2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax for py312
    "SIM",     # simplifications
    "RUF",     # ruff-specific
    "S",       # bandit: subprocess/security footguns (we shell out a lot)
    "PTH",     # prefer pathlib
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs a running Docker daemon",
    "scenario: needs a running NetForge lab",
]
