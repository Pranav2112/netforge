name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner's Docker daemon is the default context (no Colima on Linux).
  NETFORGE_DOCKER_CONTEXT: default
  UV_LOCKED: "1"

jobs:
  checks:
    name: format, lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make sync
      - run: make check

  docker-environment:
    # Proves the runner provides what later lab jobs need: a reachable Linux
    # Docker daemon. Topology/BGP scenario tests will join this job in Phase 4.
    name: docker environment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make sync
      - run: make doctor
      - run: make test-integration
